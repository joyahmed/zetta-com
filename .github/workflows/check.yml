name: check

# The same three gates release.yml runs before it builds, on every push, so a
# break shows up the day it lands rather than the day somebody tags a release.
#
# All three platforms, same as the release. Windows is where the app is used,
# but the audio and shortcut code differs per platform, and this gate used to
# run only there: macOS and Linux were first tested at tag time, so a break
# there failed a release that had changed nothing since the last green push.
# `cargo test` compiles the whole of Tauri, so Linux and macOS install the
# same packages release.yml does (copied, keep the two in step). fail-fast is
# off so one platform going red does not hide what the others say.
on:
  push:
    branches: [main, joy]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # webkit2gtk is Tauri's renderer on Linux; libasound2-dev is what cpal
      # builds against for ALSA. Without the second one the audio crate fails
      # to compile, which reads as a Rust error and is really a missing header.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev librsvg2-dev patchelf             libasound2-dev build-essential curl wget file libxdo-dev libssl-dev             libayatana-appindicator3-dev

      # libopus is C, and audiopus_sys builds it with autotools. macOS runners
      # have no autoconf toolchain, so without this it fails on `autoreconf`.
      - name: macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install autoconf automake libtool pkg-config

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned on purpose, and the same version in check.yml and release.yml.
      # `@stable` moves under us: a new clippy lint under -D warnings could
      # fail a release whose code changed nothing. Bump this deliberately,
      # in its own commit, after running clippy locally on the new version.
      # (`@master` + `toolchain:` because dtolnay's action ignores
      # rust-toolchain.toml.)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          # The toolchain action installs a minimal profile; the lint gate
          # below needs clippy named.
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
