name: release

# Tauri does not cross-compile bundles: a .dmg needs macOS tooling, .deb and
# .AppImage need Linux, and "targets: all" only ever means "all targets for the
# platform you are on". So the platforms are the matrix — this is the only way
# to get six artifacts from one push without owning three machines.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only. There was an Intel job here on `macos-13`,
          # built natively rather than cross-compiled because libopus is C
          # built by autotools and cross-compiling it means fighting configure
          # over host triples and arch flags.
          #
          # It was removed because it stopped being scheduled at all. GitHub is
          # retiring the Intel macOS image, and a job asking for `macos-13` now
          # sits queued rather than failing — 1h28m with no runner assigned and
          # no steps started, while the other three finished in under five
          # minutes each. A job that never fails and never runs holds the whole
          # release open, and a draft release cannot be published until every
          # platform has landed.
          #
          # If Intel is wanted back: build `--target universal-apple-darwin` on
          # the arm64 runner. That trades a stuck job for the autotools
          # cross-compile fight, and doubles the download for everyone.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # v5 runs on Node 24. v4 is pinned to Node 20, which the runners now
      # force-upgrade with a deprecation warning on every job.
      - uses: actions/checkout@v5

      # webkit2gtk is Tauri's renderer on Linux; libasound2-dev is what cpal
      # builds against for ALSA. Without the second one the audio crate fails
      # to compile, which reads as a Rust error and is really a missing header.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      # libopus is C, and audiopus_sys builds it with **autotools**, not cmake:
      #
      #   autogen.sh: line 14: autoreconf: command not found
      #   Failed to autogen Opus.
      #
      # macOS runners have no autoconf toolchain. Ubuntu passed only because
      # build-essential dragged in what was needed, which is why this looked
      # like a macOS-specific mystery rather than a missing tool.
      - name: macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install autoconf automake libtool pkg-config

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the mac runner needs the extra triple; asking for it elsewhere
          # is a download nobody uses.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      # Keyed on the platform and the lockfile, so a dependency change busts it
      # and a source change does not. The first build is slow; the rest are not.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zetta Com ${{ github.ref_name }}'
          releaseBody: 'Built from ${{ github.sha }}.'
          # Left as a draft on purpose: six artifacts arrive from four jobs at
          # different times, and publishing before the last one lands would put
          # a release out with platforms missing.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
