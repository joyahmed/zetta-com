[package]
name = "zetta-com"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zetta_com_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The release binary was 11 MB with none of this — cargo's defaults leave
# symbols in and optimise each crate separately.
#
# `opt-level` stays at 3 rather than dropping to "s". Audio is the one thing
# here with a deadline: the encoder, the mixer and the resampler all run per
# 20 ms frame, and trading their speed for a smaller download would be the wrong
# way round for an intercom.
[profile.release]
# Across crate boundaries, so the ring buffer and codec calls inline. Slower to
# build; the CI cache absorbs that and a release is cut rarely.
lto = true
codegen-units = 1
# Debug symbols are of no use in a binary nobody can attach to, and they are the
# largest single thing in it.
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
ringbuf = "0.5.1"
audiopus = "0.2.0"
anyhow = "1.0.104"
mdns-sd = "0.20.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
gethostname = "1.1.0"
chacha20poly1305 = "0.11.0"
sha2 = "0.11.0"
getrandom = "0.4.3"

# Not used directly. cpal 0.18.1 declares `windows` and `windows-core` as two
# independent ">=0.61, <=0.62" ranges. Tauri holds `windows` at 0.61, nothing
# holds `windows-core`, so cargo takes 0.62 for it — and cpal's WASAPI backend
# then implements a COM interface from one version against a trait from the
# other and will not compile. Naming it here keeps both halves on 0.61.
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"

