[package]
name = "zetta-com"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zetta_com_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
ringbuf = "0.5.1"
audiopus = "0.2.0"
anyhow = "1.0.104"

# Not used directly. cpal 0.18.1 declares `windows` and `windows-core` as two
# independent ">=0.61, <=0.62" ranges. Tauri holds `windows` at 0.61, nothing
# holds `windows-core`, so cargo takes 0.62 for it — and cpal's WASAPI backend
# then implements a COM interface from one version against a trait from the
# other and will not compile. Naming it here keeps both halves on 0.61.
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"

